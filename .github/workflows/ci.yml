name: NoUploadPDF CI (Next.js + React + Node.js)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Static Bundle Sync
        run: node scripts/sync-static.mjs

      - name: Run Node.js Test Suite (28 Tools, HTTP 403 Upload Guard & React Components)
        run: node --test tests/zeroUploadGuard.test.mjs

      - name: Verify Static Route & Tool Pages Exist
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/tools/merge-pdf/index.html
          test -f public/tools/compress-pdf/index.html
          test -f public/tools/redact-pdf/index.html
          test -f public/tools/ocr-pdf/index.html
